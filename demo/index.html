<title>VayTech Time Demo</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000;
  --surface: #111;
  --surface-2: #1a1a1a;
  --line: #262626;
  --text: #f5f5f5;
  --muted: #8c8c8c;
  --dim: #5c5c5c;
  --white: #fff;
  --on: #34d399;
  --on-bg: rgba(52, 211, 153, .12);
  --warn: #fbbf24;
  --warn-bg: rgba(251, 191, 36, .12);
  --bad: #f87171;
  --bad-bg: rgba(248, 113, 113, .12);
  --radius: 16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100dvh; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--white); }
.num { font-variant-numeric: tabular-nums; }

.boot { min-height: 100dvh; display: grid; place-items: center; }
.logo-mark { width: 56px; height: 56px; border-radius: 14px; background: var(--white); color: #000; display: grid; place-items: center; font-weight: 800; font-size: 30px; letter-spacing: -1px; }

/* ---------- shell ---------- */
.shell { max-width: 560px; margin: 0 auto; min-height: 100dvh; padding: calc(var(--safe-t) + 64px) 16px calc(var(--safe-b) + 96px); }
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: rgba(0,0,0,.86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding-top: var(--safe-t); }
.topbar-in { max-width: 560px; margin: 0 auto; height: 56px; padding: 0 12px 0 16px; display: flex; align-items: center; gap: 10px; }
.brand { font-weight: 800; letter-spacing: .14em; font-size: 15px; flex: 1; display: flex; align-items: center; gap: 10px; }
.brand .logo-mark { width: 28px; height: 28px; font-size: 16px; border-radius: 8px; letter-spacing: 0; }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; position: relative; cursor: pointer; }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.badge { position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #000; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.badge[hidden] { display: none; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 13px; }

.tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: rgba(0,0,0,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: flex; }
.tab { flex: 1; border: 0; background: none; padding: 9px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--dim); font-size: 11px; font-weight: 600; cursor: pointer; position: relative; }
.tab svg { width: 23px; height: 23px; }
.tab.active { color: var(--white); }
.tab .badge { top: 3px; right: calc(50% - 22px); }

h1 { font-size: 26px; line-height: 1.15; letter-spacing: -.02em; margin: 8px 0 16px; font-weight: 800; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 26px 0 10px; font-weight: 700; }
h2:first-child { margin-top: 4px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 10px; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card + .card { margin-top: 10px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; }
.item + .item { border-top: 1px solid var(--line); }
button.item:active { background: var(--surface-2); }
.item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { color: var(--muted); font-size: 13px; }
.item .r { text-align: right; flex-shrink: 0; }
.chev { color: var(--dim); flex-shrink: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.on { background: var(--on-bg); color: var(--on); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
.dot.on { background: var(--on); box-shadow: 0 0 0 4px var(--on-bg); }

/* ---------- clock ---------- */
.clock-card { text-align: center; padding: 26px 16px 22px; }
.clock-status { font-size: 14px; color: var(--muted); min-height: 21px; }
.clock-timer { font-size: 44px; font-weight: 800; letter-spacing: -.03em; margin: 6px 0 18px; }
.clock-btn { width: 190px; height: 190px; border-radius: 50%; border: 0; cursor: pointer; font-weight: 800; font-size: 20px; letter-spacing: .06em; background: var(--white); color: #000; box-shadow: 0 0 0 10px #161616, 0 0 0 11px var(--line); transition: transform .12s; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.clock-btn:active { transform: scale(.96); }
.clock-btn.out { background: #000; color: var(--white); box-shadow: 0 0 0 10px var(--on-bg), 0 0 0 11px var(--on); }
.clock-btn svg { width: 30px; height: 30px; }
.clock-btn:disabled { opacity: .6; }
.loc-note { margin-top: 18px; font-size: 12px; color: var(--dim); display: flex; align-items: center; justify-content: center; gap: 6px; }

.stat-big { font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-bottom: 6px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.split .card { margin: 0; }
.deposit { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.deposit svg { width: 22px; height: 22px; flex-shrink: 0; }

.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 110px; margin-top: 16px; }
.bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
.bar i { display: block; width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; background: var(--white); min-height: 3px; }
.bar i.zero { background: var(--line); }
.bar i.today { background: var(--on); }
.bar span { font-size: 11px; color: var(--muted); font-weight: 600; }
.bar b { font-size: 11px; font-weight: 600; color: var(--text); }

/* ---------- forms ---------- */
label.f { display: block; margin-bottom: 14px; }
label.f > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.input, select.input, textarea.input { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; outline: none; font-size: 16px; }
.input:focus { border-color: #555; }
textarea.input { min-height: 88px; resize: vertical; }
input[type="date"].input, input[type="datetime-local"].input { min-height: 50px; }
.hint { font-size: 12px; color: var(--dim); margin-top: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 700; cursor: pointer; background: var(--white); color: #000; font-size: 15px; text-decoration: none; }
.btn:active { opacity: .85; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.ok { background: var(--on); color: #000; }
.btn.sm { padding: 9px 13px; font-size: 13px; border-radius: 10px; }
.btn svg { width: 18px; height: 18px; }
.btn-row { display: flex; gap: 10px; }
.btn-row > * { flex: 1; }
.err { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 11px 14px; font-size: 14px; margin-bottom: 14px; }
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 6px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--white); color: #000; }

.action-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.action { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; text-align: left; cursor: pointer; width: 100%; }
.action:active { background: var(--surface-2); }
.action .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; flex-shrink: 0; }
.action .ic svg { width: 22px; height: 22px; }
.action .t { font-weight: 700; }
.action .s { font-size: 13px; color: var(--muted); }

.weeknav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.weeknav .lbl { flex: 1; text-align: center; font-weight: 700; }
.weeknav .lbl small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }

/* ---------- payroll ---------- */
.pay-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.pay-row + .pay-row { border-top: 1px solid var(--line); }
.check { width: 44px; height: 44px; border-radius: 12px; border: 2px solid #444; background: transparent; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; color: transparent; }
.check svg { width: 24px; height: 24px; }
.check.done { background: var(--on); border-color: var(--on); color: #000; }
.check:disabled { opacity: .35; cursor: default; }
.changed { color: var(--warn); font-size: 12px; margin-top: 3px; }

/* ---------- auth ---------- */
.auth { max-width: 420px; margin: 0 auto; min-height: 100dvh; padding: calc(var(--safe-t) + 48px) 20px 40px; display: flex; flex-direction: column; }
.auth .logo-mark { margin-bottom: 26px; }
.auth h1 { font-size: 30px; margin: 0 0 6px; }
.auth .sub { color: var(--muted); margin: 0 0 28px; }
.wordmark { font-weight: 800; letter-spacing: .18em; font-size: 13px; color: var(--muted); margin-bottom: 8px; }

/* ---------- sheet ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.7); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet { background: #0d0d0d; border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto; padding: 8px 16px calc(var(--safe-b) + 22px); animation: up .2s ease-out; }
.sheet-grab { width: 40px; height: 5px; background: #333; border-radius: 3px; margin: 4px auto 12px; }
.sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.sheet-head h3 { flex: 1; margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (min-width: 600px) { .sheet-bg { align-items: center; } .sheet { border-radius: 22px; border-bottom: 1px solid var(--line); } }

.qr-box { background: #fff; border-radius: 16px; padding: 16px; width: 252px; height: 252px; margin: 6px auto 14px; display: grid; place-items: center; }
.qr-box svg { width: 220px; height: 220px; display: block; }
.linkbox { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; font-size: 13px; word-break: break-all; color: var(--muted); margin-bottom: 12px; }

#toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 88px); transform: translateX(-50%) translateY(20px); background: var(--white); color: #000; padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.bad { background: var(--bad); }

.banner { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }
.banner .x { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px; }
.notif { padding: 14px 16px; }
.notif + .notif { border-top: 1px solid var(--line); }
.notif.unread { background: #151515; }
.notif .t { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.notif .b { color: #cfcfcf; font-size: 14px; margin-top: 2px; }
.notif .w { color: var(--dim); font-size: 12px; margin-top: 4px; }
.kv { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
.kv + .kv { border-top: 1px solid var(--line); }
.kv span:first-child { color: var(--muted); }
.spin { width: 22px; height: 22px; border: 3px solid #333; border-top-color: #fff; border-radius: 50%; animation: sp .8s linear infinite; margin: 30px auto; }
@keyframes sp { to { transform: rotate(360deg); } }
[hidden] { display: none !important; }
label.f.row { display: flex; } label.f.row > span { display: inline; margin: 0; }


.demo-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 40; height: 48px; background: #fff; color: #000; padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box; }
.demo-in { max-width: 560px; margin: 0 auto; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; }
.demo-tag { background: #000; color: #fff; font-weight: 800; font-size: 11px; letter-spacing: .12em; padding: 4px 8px; border-radius: 6px; flex-shrink: 0; }
.demo-in label { font-size: 12px; font-weight: 600; color: #555; flex-shrink: 0; }
.demo-in select { flex: 1; min-width: 0; font: inherit; font-size: 14px; font-weight: 700; color: #000; background: #f1f1f1; border: 0; border-radius: 8px; padding: 7px 8px; }
.demo-in button { font: inherit; font-size: 12px; font-weight: 700; border: 1px solid #ccc; background: #fff; color: #000; border-radius: 8px; padding: 7px 9px; cursor: pointer; flex-shrink: 0; }
.demo-in button.hot { background: #000; color: #fff; border-color: #000; }
body.demo .topbar { top: calc(48px + env(safe-area-inset-top, 0px)); padding-top: 0; }
body.demo .shell { padding-top: calc(env(safe-area-inset-top, 0px) + 112px); }
body.demo .auth { padding-top: calc(env(safe-area-inset-top, 0px) + 96px); }
@media (max-width: 380px) { .demo-in label { display: none; } }

body { background: var(--bg); }
</style>

<script>

// Minimal QR code generator (byte mode, error correction level M, versions 1–9) -> SVG.
// Follows the ISO/IEC 18004 algorithm (structure after Nayuki's reference implementation).

const ECC_M = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26];
const BLOCKS_M = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16];
const MAX_VER = 9; // verified range; ~180 bytes, far more than an invite link needs

function rawModules(ver) {
  let r = (16 * ver + 128) * ver + 64;
  if (ver >= 2) { const n = Math.floor(ver / 7) + 2; r -= (25 * n - 10) * n - 55; if (ver >= 7) r -= 36; }
  return r;
}
const dataCodewords = (ver) => Math.floor(rawModules(ver) / 8) - ECC_M[ver] * BLOCKS_M[ver];
function gfMul(x, y) { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; } return z & 0xff; }
function rsDivisor(deg) {
  const r = new Array(deg).fill(0); r[deg - 1] = 1; let root = 1;
  for (let i = 0; i < deg; i++) {
    for (let j = 0; j < r.length; j++) { r[j] = gfMul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; }
    root = gfMul(root, 0x02);
  }
  return r;
}
function rsRemainder(data, div) {
  const r = new Array(div.length).fill(0);
  for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= gfMul(c, f); }); }
  return r;
}

function encode(text) {
  const bytes = [...new TextEncoder().encode(String(text))];
  let ver = 1;
  for (; ver <= MAX_VER; ver++) { const cc = ver < 10 ? 8 : 16; if (4 + cc + bytes.length * 8 <= dataCodewords(ver) * 8) break; }
  if (ver > MAX_VER) throw new Error('Text too long for QR');
  const cap = dataCodewords(ver) * 8;
  const bits = [];
  const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
  put(4, 4); put(bytes.length, ver < 10 ? 8 : 16); for (const b of bytes) put(b, 8);
  put(0, Math.min(4, cap - bits.length));
  put(0, (8 - (bits.length % 8)) % 8);
  for (let pad = 0xec; bits.length < cap; pad ^= 0xec ^ 0x11) put(pad, 8);
  const data = [];
  for (let i = 0; i < bits.length; i += 8) data.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));

  // error correction + interleave
  const nb = BLOCKS_M[ver], eccLen = ECC_M[ver], raw = Math.floor(rawModules(ver) / 8);
  const nShort = nb - (raw % nb), shortLen = Math.floor(raw / nb);
  const div = rsDivisor(eccLen);
  const blocks = [];
  for (let i = 0, k = 0; i < nb; i++) {
    const dat = data.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1)); k += dat.length;
    const ecc = rsRemainder(dat, div);
    if (i < nShort) dat.push(0);
    blocks.push(dat.concat(ecc));
  }
  const all = [];
  for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - eccLen || j >= nShort) all.push(b[i]); });

  // matrix
  const size = ver * 4 + 17;
  const mod = Array.from({ length: size }, () => new Array(size).fill(false));
  const fn = Array.from({ length: size }, () => new Array(size).fill(false));
  const setF = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };
  for (let i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
  for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]]) {
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
      const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
      if (x >= 0 && x < size && y >= 0 && y < size) setF(x, y, d !== 2 && d !== 4);
    }
  }
  if (ver > 1) {
    const n = Math.floor(ver / 7) + 2;
    const step = Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
    const pos = [6];
    for (let p = size - 7; pos.length < n; p -= step) pos.splice(1, 0, p);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setF(pos[i] + dx, pos[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
  }
  const drawFormat = (mask) => {
    const d = (0 << 3) | mask; // level M = 00
    let rem = d; for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    const b = ((d << 10) | rem) ^ 0x5412;
    const bit = (i) => ((b >>> i) & 1) === 1;
    for (let i = 0; i <= 5; i++) setF(8, i, bit(i));
    setF(8, 7, bit(6)); setF(8, 8, bit(7)); setF(7, 8, bit(8));
    for (let i = 9; i < 15; i++) setF(14 - i, 8, bit(i));
    for (let i = 0; i < 8; i++) setF(size - 1 - i, 8, bit(i));
    for (let i = 8; i < 15; i++) setF(8, size - 15 + i, bit(i));
    setF(8, size - 8, true);
  };
  drawFormat(0); // reserve
  if (ver >= 7) {

    D.payments = D.payments.filter((p) => !(p.user_id === Number(body.user_id) && p.week_start === ws));
    if (D.payments.length === before) fail(404, 'No payment to undo'); return { ok: true };
  });
  route('GET', '/api/admin/settings', { auth: true, roles: ['owner'] }, () => ({ ...S() }));
  route('PUT', '/api/admin/settings', { auth: true, roles: ['owner'] }, ({ body }) => {
    const s = S(), n = { ...s };
    if (body.company_name !== undefined) n.company_name = str(body.company_name, 60) || s.company_name;
    if (body.timezone !== undefined) { try { new Intl.DateTimeFormat('en-US', { timeZone: String(body.timezone) }); n.timezone = String(body.timezone); } catch { fail(400, 'Unknown time zone'); } }
    const intIn = (v, lo, hi, l) => { const x = Number(v); if (!Number.isInteger(x) || x < lo || x > hi) fail(400, `${l} is not valid`); return x; };
    if (body.week_start_day !== undefined) n.week_start_day = intIn(body.week_start_day, 0, 6, 'Week start day');
    if (body.payday_weekday !== undefined) n.payday_weekday = intIn(body.payday_weekday, -1, 6, 'Payday');
    if (body.pay_delay_days !== undefined) n.pay_delay_days = intIn(body.pay_delay_days, 0, 90, 'Net days');
    if (body.max_shift_hours !== undefined) { const x = Number(body.max_shift_hours); if (!(x >= 0 && x <= 24)) fail(400, 'Max shift length must be 0–24 hours'); n.max_shift_hours = x; }
    if (body.timeoff_notice_days !== undefined) n.timeoff_notice_days = intIn(body.timeoff_notice_days, 0, 90, 'Notice days');
    if (body.ot_enabled !== undefined) n.ot_enabled = body.ot_enabled === true || body.ot_enabled === 'on' || body.ot_enabled === '1';
    if (body.ot_threshold !== undefined) { const x = Number(body.ot_threshold); if (!(x > 0 && x <= 168)) fail(400, 'Overtime hours is not valid'); n.ot_threshold = x; }
    if (body.ot_multiplier !== undefined) { const x = Number(body.ot_multiplier); if (!(x >= 1 && x <= 3)) fail(400, 'Overtime rate is not valid'); n.ot_multiplier = x; }
    D.settings = n; return { ...n };
  });
  route('POST', '/api/me/password', { auth: true }, ({ user, body }) => { if (user.password !== String(body.current || '')) fail(400, 'Current password is wrong (demo passwords are demo1234)'); if (String(body.next || '').length < 8) fail(400, 'New password must be at least 8 characters'); user.password = body.next; return { ok: true }; });

  function handle(method, url, bodyText) {
    const u = new URL(url, 'http://demo');
    const r = routes.find((x) => x.method === method && x.re.test(u.pathname));
    if (!r) return [404, { error: 'Not found' }];
    try {
      if (D.seq > 0) { capLongShifts(); }
      const m = r.re.exec(u.pathname), params = {};
      r.keys.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); });
      const user = D.session ? D.users.find((x) => x.id === D.session && x.active) : null;
      if (r.opts.auth) { if (!user) fail(401, 'Please sign in'); if (r.opts.roles && !r.opts.roles.includes(user.role)) fail(403, 'Not allowed'); }
      const body = bodyText ? JSON.parse(bodyText) : {};
      const out = r.fn({ user, params, body, query: Object.fromEntries(u.searchParams) });
      if (method !== 'GET') save();
      return [200, out];
    } catch (e) {
      if (e instanceof HttpError) return [e.status, { error: e.message }];
      console.error(e); return [500, { error: 'Something went wrong' }];
    }
  }

  /* ---------- wire up ---------- */
  D = load() || (seed(), D);
  const realFetch = window.fetch.bind(window);
  window.fetch = async (url, opts = {}) => {
    const s = typeof url === 'string' ? url : url.url;
    if (!s.startsWith('/api/')) return realFetch(url, opts);
    await new Promise((r) => setTimeout(r, 120));
    const [status, data] = handle((opts.method || 'GET').toUpperCase(), s, opts.body);
    return new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });
  };
  window.VT_DEMO = {
    users: () => D.users.filter((u) => u.active).map((u) => ({ id: u.id, name: u.name, role: u.role })),
    current: () => D.session,
    switchTo(id) { D.session = Number(id); save(); },
    reset() { try { localStorage.removeItem(KEY); } catch {} seed(); },
    lastInvite: () => D.lastInvite && D.invites.some((i) => i.token === D.lastInvite && !i.used_at && !i.revoked) ? D.lastInvite : null,
    csv(week) {
      const s = S(), ws = parseYmd(week) ? weekStartOf(week, s) : addDays(currentWeekStart(s), -7);
      const lines = ['Name,Role,Week start,Week end,Hours,Rate,Gross pay,Paid,Paid amount'];
      for (const r of payrollRows(ws, s).filter((x) => !x.idle)) lines.push([`"${r.name}"`, r.role, ws, addDays(ws, 6), r.hours, r.rate, r.gross, r.payment ? 'yes' : 'no', r.payment ? r.payment.amount : ''].join(','));
      return { name: `payroll-${ws}.csv`, text: lines.join('\n') + '\n' };
    }
  };
})();

<script>

(() => {

  async function api(method, url, body) {
    const opts = { method, headers: { 'X-VT': '1' }, credentials: 'same-origin' };
    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    let res;
    try { res = await fetch(url, opts); } catch { throw new Error('No connection. Check your signal and try again.'); }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && S.user) { S.user = null; render(); }
    if (!res.ok) throw new Error(data.error || 'Something went wrong');
    return data;
  }
  function toast(msg, bad) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = ''; }, 3200);
  }
  const money = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function hrs(h) {

    return H ? `${H}h ${String(M).padStart(2, '0')}m` : `${M}m`;

  const dec = (h) => (Math.round((h || 0) * 100) / 100).toFixed(2);
  function ymdParts(ymd) { const [y, m, d] = ymd.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
  const fmtDay = (ymd, o = {}) => ymdParts(ymd).toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric', ...o });
  const fmtShort = (ymd) => ymdParts(ymd).toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' });
  const dowLetter = (ymd) => ymdParts(ymd).toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'short' }).slice(0, 2);

  const fmtDT = (ms) => new Date(ms).toLocaleString('en-US', { timeZone: S.tz, weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: S.tz, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date(ms)).map((x) => [x.type, x.value]));

  function localInput(ms) {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: S.tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).formatToParts(new Date(ms)).map((x) => [x.type, x.value]));
    return `${p.year}-${p.month}-${p.day}T${String(+p.hour % 24).padStart(2, '0')}:${p.minute}`;
  }
  function addDays(ymd, n) { const d = ymdParts(ymd); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  const today = () => ymdOf(Date.now());

  /* ---------- shell ---------- */
  function renderShell() {
    const tabs = tabsFor(S.user.role);
    if (!S.tab || !tabs.some((t) => t[0] === S.tab)) S.tab = tabs[0][0];
    $app.innerHTML = `
      <header class="topbar"><div class="topbar-in">
        <div class="brand"><div class="logo-mark">V</div>${esc(S.boot.settings.company_name.toUpperCase())}</div>
        <button class="icon-btn" id="bell" aria-label="Notifications">${I.bell}<span class="badge" id="bell-n" hidden></span></button>
        <button class="icon-btn" id="me" aria-label="Account"><span class="avatar">${esc(initials(S.user.name))}</span></button>
      </div></header>
      <main class="shell" id="view"></main>
      <nav class="tabbar"><div class="tabbar-in">${tabs.map(([k, l, ic]) => `<button class="tab ${k === S.tab ? 'active' : ''}" data-tab="${k}">${ic}<span>${l}</span>${k === 'approvals' ? '<span class="badge" id="appr-n" hidden></span>' : ''}</button>`).join('')}</div></nav>`;
    $app.querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => { S.tab = b.dataset.tab; window.scrollTo(0, 0); renderShell(); }; });
    $app.querySelector('#bell').onclick = openNotifications;
    $app.querySelector('#me').onclick = openAccount;
    updateBadge();
    if (!S.poll) {
      S.poll = setInterval(refreshCount, 30000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user) { refreshCount(); if (S.tab === 'clock') showTab(); } });
    }
    refreshCount();
    showTab();
  }
  async function refreshCount() {
    if (!S.user) return;
    try { const r = await api('GET', '/api/notifications/count'); S.unread = r.unread; updateBadge(); } catch {}
    if (S.user.role !== 'tech') {
      try { const r = await api('GET', '/api/team/requests?status=pending'); const n = document.getElementById('appr-n'); if (n) { n.hidden = !r.items.length; n.textContent = r.items.length; } } catch {}
    }
  }
  function updateBadge() { const b = document.getElementById('bell-n'); if (b) { b.hidden = !S.unread; b.textContent = S.unread > 9 ? '9+' : S.unread; } }
  function showTab() {
    const v = document.getElementById('view');
    if (!v) return;
    v.innerHTML = '<div class="spin"></div>';
    const fn = { clock: viewClock, hours: viewHours, timeoff: viewTimeOff, team: viewTeam, approvals: viewApprovals, payroll: viewPayroll, people: viewPeople }[S.tab];
    fn(v).catch((e) => { v.innerHTML = `<div class="err">${esc(e.message)}</div><button class="btn ghost" id="rt">Try again</button>`; v.querySelector('#rt').onclick = showTab; });
  }

    openSheet('Notifications', '<div class="spin"></div>');

  const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  function installHelp() {
    if (standalone()) return '';
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    return `<div class="banner" style="margin-top:10px"><div><b>Put this app on your home screen</b><div class="muted small">${ios ? 'In Safari tap the Share button, then “Add to Home Screen”.' : 'In Chrome tap the ⋮ menu, then “Add to Home screen” or “Install app”.'}</div></div></div>`;
  }
  function installBanner() {
    let hidden = false;
    try { hidden = localStorage.getItem('vt_install_hide') === '1'; } catch {}
    if (hidden || standalone()) return '';
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    return `<div class="banner" id="ib"><div class="grow"><b>Add VayTech to your home screen</b><div class="muted small">${ios ? 'Tap Share, then “Add to Home Screen”.' : 'Tap ⋮ in Chrome, then “Add to Home screen”.'}</div></div><button class="x" aria-label="Dismiss">×</button></div>`;
  }
  function bindInstallBanner(v) {
    const ib = v.querySelector('#ib');
    if (ib) ib.querySelector('.x').onclick = () => { try { localStorage.setItem('vt_install_hide', '1'); } catch {} ib.remove(); };
  }

  /* ---------- views: worker ---------- */
  function weekBars(w) {
    const max = Math.max(8, ...w.days.map((d) => d.hours));
    const t = today();
    return `<div class="bars">${w.days.map((d) => `<div class="bar"><b>${d.hours ? dec(d.hours).replace(/\.00$/, '') : ''}</b><i class="${d.hours ? '' : 'zero'} ${d.date === t ? 'today' : ''}" style="height:${Math.max(3, (d.hours / max) * 70)}px"></i><span>${dowLetter(d.date)}</span></div>`).join('')}</div>`;
  }
  const etaText = (p) => p.eta ? (p.eta <= today() ? 'Arrived ' : 'Arriving ') + fmtDay(p.eta) : 'Sent ' + fmtShort(ymdOf(p.paid_at));
  function payStatus(w) {
    if (w.payment) return `<span class="pill on">${I.check.replace('<svg', '<svg width="13" height="13"')} ${esc(etaText(w.payment))}</span>`;
    return `<span class="pill">Pays ${esc(fmtDay(w.pay_date))}</span>`;
  }
  function shiftList(entries, opts = {}) {
    if (!entries.length) return '<div class="list"><div class="empty">No shifts yet this week.</div></div>';
    return `<div class="list">${[...entries].reverse().map((e) => {
      const h = ((e.clock_out || Date.now()) - e.clock_in) / 3600000;
      const long = !e.clock_out && h > 12;
      return `<${opts.edit ? `button class="item" data-entry="${e.id}"` : 'div class="item"'}>
        <div class="grow"><div class="t">${esc(fmtDay(ymdOf(e.clock_in)))}</div>
        <div class="s num">${esc(fmtTime(e.clock_in))} – ${e.clock_out ? esc(fmtTime(e.clock_out)) : '<span style="color:var(--on)">on the clock</span>'}${e.auto_capped ? '' : e.edited ? ' · edited' : ''}</div>
        ${e.auto_capped ? '<div class="changed">Never clocked out · app ended it automatically</div>' : ''}
        ${opts.edit ? `<div class="s">${e.in_lat != null ? `In ${mapLink(e.in_lat, e.in_lng)}` : 'In: no location'}${e.clock_out ? (e.out_lat != null ? ` · Out ${mapLink(e.out_lat, e.out_lng)}` : (e.created_by === e.user_id ? ' · Out: no location' : '')) : ''}</div>` : ''}
        ${long ? '<div class="changed">Open over 12 hours — did they forget to clock out?</div>' : ''}</div>
        <div class="r num" style="font-weight:700">${hrs(h)}</div>${opts.edit ? chev : ''}</${opts.edit ? 'button' : 'div'}>`;
    }).join('')}</div>`;
  }

  async function viewClock(v) {
    const d = await api('GET', '/api/me/dashboard');
    const w = d.week; const open = d.open;
    v.innerHTML = `${installBanner()}
      <div class="card clock-card">
        <div class="clock-status">${open ? `<span class="pill on"><span class="dot on"></span> On the clock since ${esc(fmtTime(open.clock_in))}</span>` : 'You are clocked out'}</div>
        <div class="clock-timer num" id="tm">${open ? '' : esc(new Date().toLocaleTimeString('en-US', { timeZone: S.tz, hour: 'numeric', minute: '2-digit' }))}</div>
        <button class="clock-btn ${open ? 'out' : ''}" id="cb">${I.clock}${open ? 'CLOCK OUT' : 'CLOCK IN'}</button>
        <div class="loc-note">${I.pin} Your location is saved when you clock in and out</div>
        ${d.settings.max_shift_hours ? `<div class="loc-note" style="margin-top:6px">Forget to clock out? Your shift ends on its own after ${d.settings.max_shift_hours} hours.</div>` : ''}
      </div>
      <h2>This week · ${esc(range(w.week_start, w.week_end))}</h2>
      <div class="split">
        <div class="card"><div class="stat-label">Hours</div><div class="stat-big num" id="wk-h">${dec(w.hours)}</div><div class="muted small" style="margin-top:6px">${w.overtime ? `${dec(w.regular)} reg + <b style="color:var(--warn)">${dec(w.overtime)} OT</b>` : (d.settings.ot_enabled ? `${dec(Math.max(0, d.settings.ot_threshold - w.hours))} until overtime` : hrs(w.hours) + ' worked')}</div></div>
        <div class="card"><div class="stat-label">Est. pay</div><div class="stat-big num">${money(w.gross).replace(/\.\d\d$/, '')}<span style="font-size:20px">${money(w.gross).slice(-3)}</span></div><div class="muted small" style="margin-top:6px">${money(w.rate)}/hr${w.overtime ? ` · OT ${money(w.rate * d.settings.ot_multiplier)}` : ''}</div></div>
      </div>
      <div class="card deposit">${I.bank}<div class="grow"><div style="font-weight:700">Deposit: ${esc(fmtDay(w.pay_date, { weekday: 'long' }))}</div><div class="muted small">Pay for this week is sent ${esc(fmtDay(w.pay_date))}. You'll get a notification when it's sent.</div></div></div>
      <div class="card">${weekBars(w)}</div>
      <h2>Shifts this week</h2>${shiftList(w.entries)}
      <p class="muted small" style="margin-top:14px">Forgot to clock in or out? Go to <b>Time off</b> → <b>Fix my hours</b> and your lead will correct it.</p>`;
    bindInstallBanner(v);
    if (open) {
      const tick = () => { const s = Math.floor((Date.now() - open.clock_in) / 1000); const el = document.getElementById('tm'); if (el) el.textContent = `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
      tick(); S.timer = setInterval(tick, 1000);
    }
    v.querySelector('#cb').onclick = async (e) => {
      const btn = e.currentTarget; btn.disabled = true;
      btn.lastChild.textContent = 'GETTING LOCATION…';
      const pos = await getLocation();
      try {
        const r = await api('POST', open ? '/api/clock/out' : '/api/clock/in', pos || {});
        if (r.capped) toast(`You went over ${r.hours} hours, so your shift was ended at ${r.hours} hours`, true);
        else toast(open ? 'Clocked out' + (pos ? '' : ' (no location)') : 'Clocked in' + (pos ? '' : ' (no location)'));
      } catch (err) { toast(err.message, true); }
      clearInterval(S.timer); showTab();
    };
  }

  async function viewTimeOff(v) {
    const r = await api('GET', '/api/requests');

    v.innerHTML = `<h1>Time off</h1>
      <div class="action-grid">
        <button class="action" data-new="time_off"><span class="ic">${I.cal}</span><span class="grow"><div class="t">Request a day off</div><div class="s">At least ${notice} days ahead · your supervisor approves</div></span>${chev}</button>

  function statusPill(s) { return `<span class="pill ${{ approved: 'on', pending: 'warn', denied: 'bad' }[s] || ''}">${esc({ approved: 'Approved', pending: 'Waiting', denied: 'Denied', cancelled: 'Cancelled' }[s])}</span>`; }
  function requestList(items, manage) {
    if (!items.length) return `<div class="list"><div class="empty">${manage ? 'Nothing here.' : 'No requests yet.'}</div></div>`;
    return items.map((r) => `<div class="card">
      <div class="row between"><div class="grow"><div style="font-weight:700">${manage ? esc(r.user_name) + ' · ' : ''}${esc(r.type_label)}</div><div class="muted small">${esc(range(r.start_date, r.end_date))}</div></div>${statusPill(r.status)}</div>
      ${r.reason ? `<div style="margin-top:10px;font-size:14px">${esc(r.reason)}</div>` : ''}

      ${manage && r.status === 'pending' ? `<div class="btn-row" style="margin-top:14px"><button class="btn danger sm" data-deny="${r.id}">Deny</button>${r.type === 'correction' ? `<button class="btn ghost sm" data-fixhours="${r.user_id}" data-day="${r.start_date}">Open hours</button>` : ''}<button class="btn ok sm" data-approve="${r.id}">${r.type === 'correction' ? 'Mark fixed' : 'Approve'}</button></div>` : ''}
      ${!manage && r.status === 'pending' ? `<button class="btn ghost sm" style="margin-top:12px" data-cancel="${r.id}">Cancel</button>` : ''}
      <div class="muted small" style="margin-top:8px;font-size:12px">Sent ${esc(ago(r.created_at))}</div></div>`).join('');
  }
  function newRequest(type) {
    const notice = S.boot.settings.timeoff_notice_days;
    const t = today();
    const minOff = addDays(t, notice);
    const cfg = {
      time_off: { title: 'Request a day off', min: minOff, max: '', start: minOff, note: `Pick dates on or after ${fmtDay(minOff)} (${notice} days notice).`, reason: 'Reason (optional)' },
      sick: { title: 'Call in sick', min: addDays(t, -14), max: addDays(t, 30), start: t, note: 'Your supervisor gets notified right away.', reason: 'Anything they should know? (optional)' },
      correction: { title: 'Fix my hours', min: addDays(t, -30), max: t, start: t, note: 'Tell your lead what happened. They will fix your hours.', reason: 'What needs fixing? (e.g. “Forgot to clock out, left at 4:30 PM”)' }
    }[type];
    openSheet(cfg.title, `<form><div class="form-err"></div>
      <div class="split"><label class="f"><span>${type === 'correction' ? 'Day' : 'From'}</span><input class="input" type="date" name="start_date" value="${cfg.start}" min="${cfg.min}" ${cfg.max ? `max="${cfg.max}"` : ''} required></label>
      ${type === 'correction' ? '<div></div>' : `<label class="f"><span>To</span><input class="input" type="date" name="end_date" value="${cfg.start}" min="${cfg.min}" required></label>`}</div>
      <p class="hint" style="margin:-4px 0 14px">${esc(cfg.note)}</p>
      <label class="f"><span>${esc(cfg.reason)}</span><textarea class="input" name="reason" ${type === 'correction' ? 'required' : ''}></textarea></label>
      <button class="btn block" type="submit">Send to supervisor</button></form>`, (b) => {
      const f = b.querySelector('form');
      const s = f.start_date, e = f.end_date;

      bindForm(f, async (d) => { await api('POST', '/api/requests', { type, ...d, end_date: d.end_date || d.start_date }); closeSheet(); toast('Request sent'); showTab(); });
    });
  }

  /* ---------- views: team / approvals ---------- */

      ${people.length ? `<div class="list">${people.map((p) => {

  function editEntry(personId, entry, weekStart) {
    const defIn = entry ? localInput(entry.clock_in) : `${today() <= addDays(weekStart, 6) ? today() : weekStart}T07:00`;
    const defOut = entry ? (entry.clock_out ? localInput(entry.clock_out) : '') : `${defIn.slice(0, 10)}T15:30`;
    const nowIn = localInput(Date.now());
    openSheet(entry ? 'Edit shift' : 'Add shift', `<form><div class="form-err"></div>
      <label class="f"><span>Clock in</span><input class="input" type="datetime-local" name="clock_in" value="${defIn}" max="${nowIn}" required></label>
      <label class="f"><span>Clock out</span><input class="input" type="datetime-local" name="clock_out" value="${defOut}" max="${nowIn}"><div class="hint">Leave empty only if they are still working.</div></label>
      <label class="f"><span>Reason (they will see this)</span><input class="input" name="reason" placeholder="e.g. Forgot to clock out" required></label>
      <button class="btn block" type="submit">${entry ? 'Save changes' : 'Add shift'}</button>
      ${entry ? '<button type="button" class="btn danger block" id="del" style="margin-top:10px">Remove shift</button>' : ''}</form>`, (b) => {
      const f = b.querySelector('form');
      const after = (r) => { if (r.paid_week) toast('Saved. Note: that week was already paid.', true); else toast('Saved — they were notified'); openPerson(personId, weekStart); };
      bindForm(f, async (d) => {
        const r = entry ? await api('PUT', `/api/entries/${entry.id}`, d) : await api('POST', `/api/team/${personId}/entries`, d);
        after(r);
      });
      const del = b.querySelector('#del');
      if (del) del.onclick = async () => {
        const reason = f.reason.value.trim();
        if (!reason) { f.querySelector('.form-err').innerHTML = '<div class="err">Type a reason first, then tap Remove.</div>'; f.reason.focus(); return; }
        del.disabled = true;
        try { after(await api('DELETE', `/api/entries/${entry.id}`, { reason })); } catch (e) { del.disabled = false; f.querySelector('.form-err').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
      };
    });
  }

  function defaultEta() {
    if (S.lastEta && S.lastEta >= today()) return S.lastEta;
    let d = addDays(today(), 1);
    while ([0, 6].includes(ymdParts(d).getUTCDay())) d = addDays(d, 1);
    return d;
  }

    const opts = (sel) => days.map((d, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${d}</option>`).join('');
    b.innerHTML = `<form><div class="form-err"></div>
      <label class="f"><span>Company name</span><input class="input" name="company_name" value="${esc(s.company_name)}"></label>
      <div class="split"><label class="f"><span>Week starts</span><select class="input" name="week_start_day">${opts(s.week_start_day)}</select></label>
      <label class="f"><span>Payday</span><select class="input" name="payday_weekday"><option value="-1" ${s.payday_weekday < 0 ? 'selected' : ''}>No set day</option>${opts(s.payday_weekday)}</select></label></div>
      <label class="f"><span>Net days (pay is due this many days after the week ends)</span><input class="input" name="pay_delay_days" id="netd" type="number" min="0" max="90" value="${s.pay_delay_days}"></label>
      <p class="hint" id="payex" style="margin:-6px 0 14px"></p>
      <label class="f row" style="gap:10px"><input type="checkbox" name="ot_enabled" id="ote" ${s.ot_enabled ? 'checked' : ''} style="width:20px;height:20px"><span style="margin:0;color:var(--text)">Pay overtime</span></label>
      <div class="split" id="otf" ${s.ot_enabled ? '' : 'hidden'}><label class="f"><span>Overtime after (hrs/week)</span><input class="input" name="ot_threshold" type="number" step="0.5" value="${s.ot_threshold}"></label>
      <label class="f"><span>Overtime rate (×)</span><input class="input" name="ot_multiplier" type="number" step="0.1" value="${s.ot_multiplier}"></label></div>
      <label class="f"><span>Max shift length (hours)</span><input class="input" name="max_shift_hours" type="number" min="0" max="24" step="0.25" value="${s.max_shift_hours}"><div class="hint">If someone forgets to clock out, or clocks out late, the shift is cut to this length and their lead is told. 0 = no limit.</div></label>
      <label class="f"><span>Days of notice for time off</span><input class="input" name="timeoff_notice_days" type="number" min="0" max="90" value="${s.timeoff_notice_days}"></label>
      <label class="f"><span>Time zone</span><input class="input" name="timezone" value="${esc(s.timezone)}"><div class="hint">For example America/Chicago, America/New_York</div></label>
      <button class="btn block" type="submit">Save settings</button></form>
      <a class="btn ghost block" style="margin-top:10px" href="/api/admin/backup">Download a backup of all data</a>
      <p class="hint" style="text-align:center">Do this once a week and keep the file somewhere safe.</p>`;
    b.querySelector('#ote').onchange = (e) => { b.querySelector('#otf').hidden = !e.target.checked; };
    const f = b.querySelector('form');
    const example = () => {
      const end = addDays(addDays(today(), -((ymdParts(today()).getUTCDay() - Number(f.week_start_day.value) + 7) % 7)), 6);
      let pd = addDays(end, Math.max(1, Number(f.pay_delay_days.value) || 0));
      const wd = Number(f.payday_weekday.value);
      if (wd >= 0) while (ymdParts(pd).getUTCDay() !== wd) pd = addDays(pd, 1);
      b.querySelector('#payex').textContent = `Example: the week ending ${fmtDay(end)} is paid ${fmtDay(pd)}.`;
    };
    ['week_start_day', 'payday_weekday', 'pay_delay_days'].forEach((n) => f[n].addEventListener('input', example));
    example();
    bindForm(b.querySelector('form'), async (d) => { d.ot_enabled = b.querySelector('#ote').checked; const r = await api('PUT', '/api/admin/settings', d); S.boot.settings = { ...S.boot.settings, ...r }; S.tz = r.timezone; closeSheet(); toast('Settings saved'); renderShell(); });
  }

  window.VT_REBOOT = () => { document.getElementById('toast').className = ''; S.tab = null; S.payWeek = null; S.apprStatus = 'pending'; closeSheet(); boot(); };
  window.VT_TOAST = toast;
  window.VT_SHEET = openSheet;
  if ('serviceWorker' in navigator && !window.VT_DEMO) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  boot();
})();

</script>
<script>

(() => {
  const sel = document.getElementById('demo-who');
  const inv = document.getElementById('demo-inv');
  const rst = document.getElementById('demo-reset');
  const order = { owner: 0, supervisor: 1, tech: 2 }, roleTag = { owner: 'Owner', supervisor: 'Lead', tech: 'Tech' };
  const clean = (t) => String(t).replace(/[<>&"]/g, '');
  function fill() {
    const cur = window.VT_DEMO.current();
    const us = window.VT_DEMO.users().sort((a, b) => (order[a.role] - order[b.role]) || a.name.localeCompare(b.name));
    const html = (cur ? '' : '<option value="">Signed out</option>') + us.map((u) => '<option value="' + u.id + '"' + (u.id === cur ? ' selected' : '') + '>' + clean(u.name) + ' — ' + roleTag[u.role] + '</option>').join('');
    if (sel.dataset.h !== html) { sel.innerHTML = html; sel.dataset.h = html; }
    inv.hidden = !window.VT_DEMO.lastInvite();
  }
  sel.onchange = () => { if (!sel.value) return; window.VT_JOIN = null; window.VT_DEMO.switchTo(sel.value); window.VT_REBOOT(); fill(); };
  let armed = null;
  rst.onclick = () => {
    if (!armed) { rst.textContent = 'Tap again'; rst.classList.add('hot'); armed = setTimeout(() => { armed = null; rst.textContent = 'Reset'; rst.classList.remove('hot'); }, 3000); return; }
    clearTimeout(armed); armed = null; rst.textContent = 'Reset'; rst.classList.remove('hot');
    window.VT_DEMO.reset(); window.VT_JOIN = null; window.VT_REBOOT(); fill(); window.VT_TOAST('Demo reset to the sample crew');
  };
  inv.onclick = () => { const t = window.VT_DEMO.lastInvite(); if (!t) return; window.VT_JOIN = t; window.VT_REBOOT(); };
  setInterval(fill, 800); fill();
  const sites = [[41.8781, -87.6298], [41.9742, -87.9073], [41.7508, -87.7124], [42.0451, -87.6877]];
  window.VT_FAKE_LOCATION = () => { const s = sites[Math.floor(Math.random() * sites.length)]; return { lat: s[0] + Math.random() * 0.003, lng: s[1] + Math.random() * 0.003, acc: 10 }; };
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="/api/"]');
    if (!a) return;
    e.preventDefault();
    if (a.getAttribute('href').startsWith('/api/admin/payroll.csv')) {
      const week = new URLSearchParams(a.getAttribute('href').split('?')[1] || '').get('week');
      const f = window.VT_DEMO.csv(week);
      window.VT_SHEET(f.name, '<p class="muted" style="margin-top:0">In the real app this downloads as a spreadsheet you can open in Excel. Here is what is inside:</p><pre id="csvp" style="background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;overflow-x:auto;white-space:pre;user-select:all">' + f.text.replace(/[<&]/g, (c) => c === '<' ? '&lt;' : '&amp;') + '</pre><button class="btn ghost block" id="csvc">Copy</button>', (b) => {
        b.querySelector('#csvc').onclick = () => { navigator.clipboard.writeText(f.text).then(() => window.VT_TOAST('Copied'), () => { const r = document.createRange(); r.selectNodeContents(b.querySelector('#csvp')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); window.VT_TOAST('Selected — copy it'); }); };
      });
    } else window.VT_TOAST('In the real app this downloads a backup file');
  }, true);
})();
</script>
